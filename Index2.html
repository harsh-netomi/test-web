  async function fetchToken(){

    const queryString = window.location.search;
    const urlParams = new URLSearchParams(queryString);
    const login = urlParams.get('login');
    let token = "";

    if(login == 'true') {
      const tokenApiCall = await fetch('https://chatapps-us.netomi.com/api/fetchJWT',  {

        headers: {

            }
          }})
        }})
      const resp = await tokenApiCall.json()
      token = resp.token;
