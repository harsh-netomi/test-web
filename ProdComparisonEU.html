<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Netomi Chat</title>

  <script>
    (function () {
      var ns = document.createElement('script');

      ns.src = 'https://chatapps-qa.netomi.com/app/script.js';
      ns.type = 'text/javascript';
      ns.async = true;

      ns.setAttribute(
        'botRefId',
        'a5addd98-2627-437b-899c-2f97ff2e2b18'
      );

      ns.setAttribute('enableEventQueue', 'true');

      ns.onload = function () {
        var authStarted = false;

        Netomi.chat.onLoad(() => {
            console.log('1: netomi onLoad being called')
            authenticate();
        });
      };

      var s = document.getElementsByTagName('script')[0];
      s.parentNode.insertBefore(ns, s);

      var reAuthenticateIntervalId = null;

      async function authenticate() {
        console.log('2: log is being called')
        // Do not expose a real JWT directly in client-side source code.
        // Replace this with your valid token only for testing.
        const token = '';

        if (token !== '') {
          Netomi.chat.login(token);
        }

        reAuthenticateIntervalId = setInterval(function () {
          Netomi.chat.authenticate(async function (sendTokenToNetomi) {
            try {
              const token = await fetchToken();

              if (token !== '') {
                sendTokenToNetomi(token, handleAuthError);
              }
            } catch (error) {
              console.error('Token refresh failed:', error);
              handleAuthError();
            }
          });
        }, 55000);
      }

      async function fetchToken() {
        const queryString = window.location.search;
        const urlParams = new URLSearchParams(queryString);
        const login = urlParams.get('login');

        let token = '';

        if (login === 'true') {
          try {
            const tokenApiCall = await fetch(
              'https://chatapps-qa.netomi.com/api/fetchJWT',
              {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json',
                  'x-token-expiry': '1m',
                  'x-bot-ref-id':
                    'a5addd98-2627-437b-899c-2f97ff2e2b18',
                  'x-user-details': JSON.stringify({
                    uname: 'John',
                    externalId: 'random@random1',
                    metadata: {
                      Name: 'John Doe',
                      ID: 'NET9879',
                      Organization: 'ABCSamples',
                      curTime: new Date().toLocaleTimeString(),
                      Location: {
                        City: 'Chicago',
                        State: 'Illinois'
                      }
                    }
                  })
                }
              }
            );

            if (!tokenApiCall.ok) {
              throw new Error(
                'Token API returned HTTP ' + tokenApiCall.status
              );
            }

            const resp = await tokenApiCall.json();
            token = resp.token || '';
          } catch (error) {
            console.error('Unable to fetch JWT:', error);
          }
        }

        console.log('Token available:', token !== '');
        return token;
      }

      function handleAuthError() {
        /*
          Clients can perform necessary actions here.
          This function is called by Netomi upon token
          expiration or when a refresh token is not received.
        */
        console.log('handleAuthError');
      }

      /*
      function endAuth() {
        if (reAuthenticateIntervalId !== null) {
          clearInterval(reAuthenticateIntervalId);
          reAuthenticateIntervalId = null;
        }

        Netomi.chat.logout();
      }
      */

    })();
  </script>
</head>

<body>
</body>
</html>
