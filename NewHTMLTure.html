<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title></title>

    <!--
      NET-65437 repro page.

      This is the client's own integration, copied as-is. Three things differ,
      all of them forced by running locally and marked LOCAL ONLY below:
        1. ns.src is /script.js instead of the chatapps-us URL
        2. the debug attribute is added
        3. fetchJWT is called on /api/fetchJWT instead of the absolute URL

      To reproduce: escalate to an agent, wait for them to join
      (net_controlType in localStorage becomes AGENT), then reload the page.
      login() runs once per page load from the init callback below, and that is
      what used to knock controlType back to BOT.
    -->
    <script>
      ;(function () {
        var ns = document.createElement('script')
        // LOCAL ONLY: served by webpack-dev-server out of test/
        ns.src = '/script.js'
        ns.type = 'text/javascript'
        ns.async = true
        ns.setAttribute('botRefId', '3d51f888-5c9a-4e35-bd86-b4cb8cd00f12')
        ns.setAttribute('enableEventQueue', 'true')
        // LOCAL ONLY: LoadIframe only takes the localhost branch when
        // hostname === 'localhost' && debug === 'true'. Without this it runs
        // new URL('/script.js'), which throws, and the widget never loads.
        ns.setAttribute('debug', 'true')

        var s = document.getElementsByTagName('script')[0]
        s.parentNode.insertBefore(ns, s)
        ns.onload = function () {
          authenticate()
          // window.Netomi.chat.init(() => {
          // })
          // Netomi.chat.onLoad(() => {
          //   authenticate()
          // })
        }
      })()

      let reAuthenticateIntervalId = ''
      async function authenticate() {
        const token = await fetchToken()
        if (token != '') {
          Netomi.chat.login(token)
        }

        reAuthenticateIntervalId = setInterval(() => {
          Netomi.chat.authenticate(async (sendTokenToNetomi) => {
            const token = await fetchToken()
            if (token != '') {
              sendTokenToNetomi(token, handleAuthError)
            }
          })
        }, 55000)
      }

      async function fetchToken() {
        // LOCAL ONLY: /api is proxied to the node server by webpack.local.conf
        const tokenApiCall = await fetch('/api/fetchJWT', {
          method: 'post',
          headers: {
            'Content-Type': 'application/json',
            'x-token-expiry': '1m',
            'x-bot-ref-id': '3d51f888-5c9a-4e35-bd86-b4cb8cd00f12',
            'x-user-details': JSON.stringify({
              uname: 'John',
              externalId: 'random@random1',
              metadata: {
                Name: 'John Doe',
                ID: 'NET9879',
                Organization: 'ABCSamples',
                curTime: new Date().toLocaleTimeString(),
                Location: {
                  City: 'Chicago',
                  State: 'Illinois'
                }
              }
            })
          }
        })
        const { token } = await tokenApiCall.json()

        console.log(token)
        return token
      }

      function handleAuthError() {
        /*
          Clients will perform necessary actions in this function, which will be
          called by netomi upon token expiration or not receiving a refresh
          token.
        */
        console.log('handleAuthError')
      }

      function endAuth() {
        clearInterval(reAuthenticateIntervalId)
        Netomi.chat.logout()
      }

      async function manualLogin() {
        const token = await fetchToken()
        if (token != '') {
          Netomi.chat.login(token)
        }
      }

      function clearAuth() {
        Object.keys(localStorage)
          .filter((key) => key.startsWith('net_'))
          .forEach((key) => localStorage.removeItem(key))

        document.cookie.split(';').forEach((cookie) => {
          const name = cookie.split('=')[0].trim()
          if (name.startsWith('net_')) {
            document.cookie = `${name}=;expires=Thu, 01 Jan 1970 00:00:00 GMT;path=/`
          }
        })

        location.reload()
      }
    </script>
  </head>
  <body>
    <button onclick="manualLogin()">Login</button>
    <button onclick="endAuth()">Logout</button>
    <button onclick="clearAuth()">Clear Auth</button>
  </body>
</html>
